name: Standalone Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish after rebuilding release assets
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest ruff

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          expected = f"v{metadata['project']['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual} does not match {expected}")

      - name: Run tests
        run: python -m pytest

      - name: Run static checks
        run: ruff check claude_scheduler tests scripts/standalone_entry.py

      - name: Check shell installer syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh

      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $syntaxElements = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path install.ps1),
              [ref]$syntaxElements,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }

  build:
    name: ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            source: dist/ccs
            asset: ccs-linux-x86_64
          - os: windows-latest
            source: dist/ccs.exe
            asset: ccs-windows-x86_64.exe
          - os: macos-15-intel
            source: dist/ccs
            asset: ccs-macos-x86_64
          - os: macos-14
            source: dist/ccs
            asset: ccs-macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.21.0 .

      - name: Build standalone executable
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile
          --name ccs
          --copy-metadata claude-scheduler
          scripts/standalone_entry.py

      - name: Name asset and write checksum
        env:
          SOURCE: ${{ matrix.source }}
          ASSET: ${{ matrix.asset }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE"])
          asset = source.with_name(os.environ["ASSET"])
          source.replace(asset)
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          asset.with_name(f"{asset.name}.sha256").write_text(
              f"{digest}  {asset.name}\n",
              encoding="utf-8",
          )

      - name: Verify standalone executable
        env:
          ASSET: ${{ matrix.asset }}
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          executable = (Path("dist") / os.environ["ASSET"]).resolve()
          result = subprocess.run(
              [str(executable), "version"],
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          raise SystemExit(result.returncode)

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
