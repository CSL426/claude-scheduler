name: Cross-platform CLI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest ruff

      - name: Run tests
        run: python -m pytest

      - name: Run static checks
        run: ruff check claude_scheduler tests scripts/standalone_entry.py

      - name: Check shell installer syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh

      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $syntaxElements = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path install.ps1),
              [ref]$syntaxElements,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }
